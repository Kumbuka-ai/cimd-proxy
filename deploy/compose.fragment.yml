services:
  # Personal-access-token schema migrations, same tag as the proxy. It reads
  # the FLYWAY_* lines of deploy.env; with FLYWAY_USER and FLYWAY_PASSWORD
  # absent or empty (tokens off) it exits 0 without touching a database, so the
  # proxy can always wait for it.
  cimd-proxy-migrate:
    image: ghcr.io/kumbuka-ai/cimd-proxy-migrations:v0.5.0
    restart: "no"
    env_file:
      - deploy.env
    networks:
      - edge

  cimd-proxy:
    image: ghcr.io/kumbuka-ai/cimd-proxy:v0.5.0
    restart: unless-stopped
    depends_on:
      cimd-proxy-migrate:
        condition: service_completed_successfully
    env_file:
      - deploy.env
    # With personal access tokens: mount the signing key(s) read-only and point
    # PAT_SIGNING_KEY_n_FILE at them.
    #volumes:
    #  - ./secrets/pat-2026-10.pem:/run/secrets/pat-2026-10.pem:ro
    # Bound to loopback only: the reverse proxy reaches the container on the
    # shared network, so nothing needs to be published on a public interface.
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - edge

networks:
  edge:
    external: true
