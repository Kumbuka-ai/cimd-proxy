name: release

on:
  push:
    tags:
      - "v*"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: kumbuka-ai/cimd-proxy
      # The schema migrations, built from the same tag: Flyway plus the SQL files
      # under src/cimd_proxy/migrations/ (Dockerfile.migrations). A deployment
      # runs it before the proxy; the two always carry the same schema version.
      MIGRATIONS_IMAGE_NAME: kumbuka-ai/cimd-proxy-migrations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          echo "version=${ref}" >> "${GITHUB_OUTPUT}"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "migrations_image=${REGISTRY}/${MIGRATIONS_IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.title=cimd-proxy
            org.opencontainers.image.description=OAuth 2.1 authorization server speaking CIMD outward and federating to an OIDC provider.
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push the migrations image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.migrations
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.migrations_image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.migrations_image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.title=cimd-proxy-migrations
            org.opencontainers.image.description=Flyway schema migrations of the cimd-proxy personal-access-token store.
            org.opencontainers.image.licenses=Apache-2.0
