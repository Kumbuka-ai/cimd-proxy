sonar.projectKey=Kumbuka-ai_cimd-proxy
sonar.organization=kumbuka-ai
sonar.projectName=cimd-proxy
sonar.projectVersion=0.2.1

# The key above is the natural one for this repository. A SonarCloud project
# under the same key may still exist from an earlier repository; if so it has
# to be removed or re-keyed there first, otherwise the analysis of this
# repository writes into that project's measures instead of its own.

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.13

sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=deploy/**,.github/**
sonar.coverage.exclusions=tests/**,src/cimd_proxy/__main__.py

# python:S3415 asks tests to unify assertion argument order across the file.
# pytest tests use bare `assert observed == expected` throughout, which is
# the standard idiom; the rule mis-reads `assert computed == fixture` as
# "expected first" and there is no phrasing that satisfies it for every
# case. Suppressed in tests only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3415
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*.py
